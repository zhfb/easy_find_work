{% extends "base.html" %}
{% block title %}智能助手 - EFW-AI{% endblock %}
{% block head %}
<style>
  .chat-container { display: flex; flex-direction: column; height: calc(100vh - 140px); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px 0; }
  .msg { margin-bottom: 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user .msg-bubble { background: #1a1a2e; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .msg-bubble { background: #fff; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
  .msg.error .msg-bubble { background: #fee; color: #c33; border: 1px solid #fcc; }
  .confirm-card { background: #fffbeb; border: 1px solid #f59e0b; border-radius: 8px; padding: 12px 16px; margin-top: 8px; }
  .confirm-card .title { font-weight: 600; color: #92400e; margin-bottom: 6px; }
  .confirm-card .args { font-size: 13px; color: #78716c; margin-bottom: 10px; font-family: monospace; }
  .confirm-card .btns { display: flex; gap: 8px; }
  .confirm-card button { padding: 6px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; }
  .confirm-card .btn-confirm { background: #1a1a2e; color: #fff; }
  .confirm-card .btn-cancel { background: #e5e7eb; color: #374151; }
  .confirm-card.confirmed { opacity: 0.6; }
  .chat-input { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid #eee; }
  .chat-input input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
  .chat-input input:focus { border-color: #1a1a2e; }
  .chat-input button { padding: 10px 24px; background: #1a1a2e; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { color: #999; font-style: italic; }
</style>
{% endblock %}
{% block content %}
<div class="chat-container">
  <div class="chat-messages" id="chatMessages">
    <div class="msg assistant"><div class="msg-bubble">你好！我是 EFW-AI 智能投递助手。你可以问我投递统计、任务状态，或者让我帮你启动/暂停任务。</div></div>
  </div>
  <div class="chat-input">
    <input type="text" id="msgInput" placeholder="输入消息，回车发送..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<script>
const TOOL_LABELS = {
  start_task: "启动任务",
  pause_task: "暂停任务",
  update_task_config: "更新任务配置",
  regenerate_message: "重新生成文案",
};

let isStreaming = false;

async function loadHistory() {
  try {
    const resp = await fetch("/api/chat/history");
    const data = await resp.json();
    const container = document.getElementById("chatMessages");
    // 清空欢迎语以外的内容
    container.innerHTML = '<div class="msg assistant"><div class="msg-bubble">你好！我是 EFW-AI 智能投递助手。你可以问我投递统计、任务状态，或者让我帮你启动/暂停任务。</div></div>';
    for (const m of data.messages) {
      appendMessage(m.role, m.content);
    }
  } catch (e) { console.warn("加载历史失败", e); }
}

function appendMessage(role, text) {
  const container = document.getElementById("chatMessages");
  const div = document.createElement("div");
  div.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.textContent = text;
  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return bubble;
}

function appendConfirmCard(bubble, event) {
  const card = document.createElement("div");
  card.className = "confirm-card";
  const label = TOOL_LABELS[event.tool] || event.tool;

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = "⚠ 需要确认：" + label;
  card.appendChild(title);

  const argsDiv = document.createElement("div");
  argsDiv.className = "args";
  argsDiv.textContent = JSON.stringify(event.args);
  card.appendChild(argsDiv);

  const btns = document.createElement("div");
  btns.className = "btns";
  const confirmBtn = document.createElement("button");
  confirmBtn.className = "btn-confirm";
  confirmBtn.textContent = "确认执行";
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "btn-cancel";
  cancelBtn.textContent = "取消";
  btns.appendChild(confirmBtn);
  btns.appendChild(cancelBtn);
  card.appendChild(btns);

  confirmBtn.onclick = async () => {
    confirmBtn.disabled = true;
    cancelBtn.disabled = true;
    try {
      const resp = await fetch("/api/chat/confirm", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({confirm_id: event.confirm_id}),
      });
      const data = await resp.json();
      if (data.ok) {
        card.classList.add("confirmed");
        card.querySelector(".title").textContent = "✓ 已执行：" + label;
        card.querySelector(".btns").remove();
      } else {
        alert("执行失败: " + (data.detail || "未知错误"));
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
      }
    } catch (e) {
      alert("请求失败: " + e);
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
    }
  };
  cancelBtn.onclick = () => {
    card.classList.add("confirmed");
    card.querySelector(".title").textContent = "✗ 已取消：" + label;
    card.querySelector(".btns").remove();
  };
  bubble.appendChild(card);
}

async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;

  isStreaming = true;
  document.getElementById("sendBtn").disabled = true;
  input.value = "";

  appendMessage("user", text);
  const assistantBubble = appendMessage("assistant", "");
  assistantBubble.classList.add("typing");
  assistantBubble.textContent = "思考中...";

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text}),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || ("HTTP " + resp.status));
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let firstDelta = true;

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split("\n");
      buffer = lines.pop(); // 保留不完整的行

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = line.slice(6).trim();
        if (!payload) continue;
        const event = JSON.parse(payload);

        if (event.type === "delta") {
          if (firstDelta) {
            assistantBubble.textContent = "";
            assistantBubble.classList.remove("typing");
            firstDelta = false;
          }
          assistantBubble.textContent += event.text;
          document.getElementById("chatMessages").scrollTop = document.getElementById("chatMessages").scrollHeight;
        } else if (event.type === "confirm") {
          if (firstDelta) {
            assistantBubble.textContent = "";
            assistantBubble.classList.remove("typing");
            firstDelta = false;
          }
          appendConfirmCard(assistantBubble, event);
        } else if (event.type === "error") {
          assistantBubble.classList.remove("typing");
          assistantBubble.textContent = event.text;
          assistantBubble.parentElement.className = "msg error";
        } else if (event.type === "done") {
          if (firstDelta) {
            assistantBubble.textContent = "";
            assistantBubble.classList.remove("typing");
          }
        }
      }
    }
  } catch (e) {
    assistantBubble.classList.remove("typing");
    assistantBubble.textContent = "出错了: " + e.message;
    assistantBubble.parentElement.className = "msg error";
  } finally {
    isStreaming = false;
    document.getElementById("sendBtn").disabled = false;
    input.focus();
  }
}

document.getElementById("msgInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

loadHistory();
</script>
{% endblock %}
