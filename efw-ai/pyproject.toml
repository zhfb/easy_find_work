[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "efw-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "playwright>=1.48",
  "openai>=1.50",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
